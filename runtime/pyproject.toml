[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halthinks-vibecut-runtime"
version = "0.1.0"
description = "Editor-agnostic governed planning/policy/protocol runtime for VibeCut adapters"
requires-python = ">=3.10"
authors = [{name = "halthinks"}]
license = {text = "LicenseRef-halthinks-Proprietary"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
